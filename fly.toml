# fly.toml app configuration file generated for riftwatch on 2026-10-26T21:58:19+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'riftwatch'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  CRAWL_REGION = 'euw1'
  NODE_ENV = 'production'
  PORT = '3001'

[[mounts]]
  source = 'riftwatch_data'
  destination = '/app/server/data'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
