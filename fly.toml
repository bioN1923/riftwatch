# Fly.io config for Riftwatch. Change `app` to the name you pick in `fly apps create`.
app = 'riftwatch'
primary_region = 'fra' # Frankfurt; 'ams' (Amsterdam) also works well for EU players

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '3001'
  CRAWL_REGION = 'euw1' # ladder the background collector reads (euw1, eun1, kr, na1…)

[http_service]
  internal_port = 3001
  force_https = true
  # Keep the machine running: the collector and rank tracker work in the background.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = 'GET'
    path = '/api/health'
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'

# Champion stats, the player index and rank history are saved here between deploys.
[mounts]
  source = 'riftwatch_data'
  destination = '/app/server/data'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
