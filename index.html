<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Look up any League of Legends player: rank, match history, champion stats and live games." />
    <!-- Champion, item and rune art comes from Riot's Data Dragon: open that connection while the app loads. -->
    <link rel="preconnect" href="https://ddragon.leagueoflegends.com" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#091315" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#edf2f1" media="(prefers-color-scheme: light)" />
    <title>Riftwatch — League of Legends stats</title>
    <script>
      try {
        var t = localStorage.getItem('rw:theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
