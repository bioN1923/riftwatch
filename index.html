<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Look up any League of Legends player: rank, match history, champion stats and live games." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Riftwatch — League of Legends stats</title>
    <script>
      try {
        var t = localStorage.getItem('rw:theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        var m = localStorage.getItem('rw:motion');
        if (m === 'on' || m === 'off') document.documentElement.dataset.motion = m;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
